# -----------------------------------------------------------------------------
# SOURCES
# Run `python internwatch.py --check-sources` after any edit here.
# -----------------------------------------------------------------------------
sources:
  query: "intern"

  # A NOTE ON COVERAGE: microsoft, google, meta, apple, and amazon below hit
  # each company's own search endpoint directly. Some of these companies run
  # active bot-detection (Cloudflare/Akamai-style fingerprinting) that blocks
  # or intermittently blocks plain server-to-server requests like this script's.
  # When one goes quiet, it is usually that, not a config problem, and it is
  # not something worth chasing with fingerprint-spoofing or proxies.
  # simplify_urls below is the real backbone: a community-maintained feed that
  # already includes MSFT/Google/Meta/AMD/Amazon postings independent of
  # whether their direct endpoint responds this run. Direct sources add a bit
  # of speed and redundancy on top; they are not the thing coverage depends on.

  # Community-maintained feed. Fastest single signal that exists for internships.
  # Repo name rolls over each cycle; first URL that responds wins.
  simplify_urls:
    - https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
    - https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json
    - https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/.github/scripts/listings.json
    - https://raw.githubusercontent.com/vanshb03/Summer2026-Internships/dev/.github/scripts/listings.json

  # Workday CXS API. host / tenant / site come straight out of the careers URL:
  #   https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite
  #          ^host                        ^tenant is the subdomain   ^site
  workday:
    NVIDIA:
      host: nvidia.wd5.myworkdayjobs.com
      tenant: nvidia
      site: NVIDIAExternalCareerSite
    # AMD is intentionally absent here: they run on iCIMS, not Workday, and
    # iCIMS has no public JSON feed (only rendered HTML). AMD roles still reach
    # you through the simplify-feed source below, which already covers them.
    Qualcomm:
      host: qualcomm.wd12.myworkdayjobs.com   # was wd5, they migrated tenants
      tenant: qualcomm
      site: External
    Micron:
      host: micron.wd1.myworkdayjobs.com
      tenant: micron
      site: External
    Intel:
      host: intel.wd1.myworkdayjobs.com
      tenant: intel
      site: External
    Marvell:
      host: marvell.wd1.myworkdayjobs.com
      tenant: marvell
      site: MarvellCareers
    Analog Devices:
      host: analogdevices.wd1.myworkdayjobs.com
      tenant: analogdevices
      site: External
    Applied Materials:
      host: amat.wd1.myworkdayjobs.com
      tenant: amat
      site: External

  # Greenhouse boards. Token is the slug in job-boards.greenhouse.io/<token>
  greenhouse:
    Anduril: andurilindustries
    Databricks: databricks
    Stripe: stripe
    Zoox: zoox
    Waymo: waymo
    Skydio: skydio
    Astranis: astranis

  # Lever boards. Token is the slug in jobs.lever.co/<token>
  lever: {}
