# -----------------------------------------------------------------------------
# ROLES
# -----------------------------------------------------------------------------
roles:
  # Title MUST contain one of these or it is not an internship.
  # "university grad" deliberately removed: that means full-time new grad, not an intern.
  must_any: [intern, internship, "co-op", "coop", "co op", "student worker", "student intern"]

  # UNDERGRAD ONLY. You're class of Dec 2027, so anything grad-gated is noise.
  undergrad:
    # Reject on title outright.
    title_block:
      - "phd"
      - "ph.d"
      - "ph d"
      - "doctoral"
      - "postdoc"
      - "post-doc"
      - "masters"
      - "master's"
      - "ms/phd"
      - "ms or phd"
      - "graduate student"
      - "grad student"
      - "new grad"
      - "university graduate"
      - "recent graduate"
      - "early career"
      - "mba"
      - "research scientist"

    # Reject on description, but ONLY on phrasing that is exclusively grad-gated.
    # A plain mention of "PhD" is not enough: tons of good postings say
    # "BS/MS/PhD in EE or CS", which you qualify for.
    body_block:
      - "pursuing a phd"
      - "pursuing a ph.d"
      - "phd candidate"
      - "ph.d. candidate"
      - "phd student"
      - "ph.d. student"
      - "phd required"
      - "phd is required"
      - "must be pursuing a doctoral"
      - "enrolled in a phd"
      - "graduate students only"
      - "master's degree required"
      - "masters degree required"
      - "ms degree required"

    # If any of these also appear, the body_block above is overridden, because the
    # posting is explicitly open to undergrads.
    undergrad_signals:
      - "bachelor"
      - "b.s."
      - "bs/ms"
      - "bs or ms"
      - "undergraduate"
      - "rising senior"
      - "rising junior"
      - "sophomore"

  # Instant reject on title.
  block:
    - senior
    - staff
    - principal
    - manager
    - director
    - lead
    - "phd"
    - mba
    - recruiter
    - sales
    - marketing
    - "supply chain"
    - technician
    - "service advisor"
    - "customer"
    - finance
    - accounting
    - legal
    - "human resources"
    - "military veteran"     # Amazon posts vet-only mirrors of every SDE intern req

  # Wrong term. Hard reject. Set for Summer 2027 only.
  # Note this blocks on the SEASON being wrong, not on 2027 being absent, because
  # plenty of good reqs are titled plainly with the season only in the body.
  block_terms:
    - "summer 2026"
    - "fall 2026"
    - "winter 2026"
    - "spring 2026"
    - "spring 2027"    # you're back at UT
    - "fall 2027"      # you graduate in December
    - "winter 2027"

  # Right term. Boosts score, does not hard-filter, because plenty of great
  # postings just say "Software Engineer Intern" with no season in the title.
  term_boost: ["summer 2027", "2027"]

  embedded:
