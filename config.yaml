# =============================================================================
# internwatch config
# Tuned for: ECE @ UT Austin, embedded SWE lean, currently Tesla co-op @ $50/hr
# =============================================================================

poll_seconds: 600        # 10 min. Under ~5 min you risk rate limits, and no ATS
                         # posts fast enough for it to matter.
min_score: 6             # raise to 8 for signal-only, drop to 4 for firehose
state_retention_days: 400  # forget a posting after this long so reposts re-alert

# -----------------------------------------------------------------------------
# NOTIFICATIONS
# -----------------------------------------------------------------------------
notify:
  channels: [ntfy]       # options: ntfy, twilio, telegram, discord. Can list several.
  batch_size: 1          # 1 = one message per role (best for urgency).
                         # 3-5 = fewer messages, cheaper on Twilio.

  ntfy:                  # FREE. Install the "ntfy" app, subscribe to your topic.
    server: https://ntfy.sh
    topic: "maaz-iw-746de7f46018"
    # ^ generated for you. The topic IS the password: anyone who guesses it reads
    #   your alerts. On GitHub Actions this is overridden by the NTFY_TOPIC secret,
    #   so you can leave this blank if the repo is public.

  twilio:                # REAL SMS to your phone. ~$1.15/mo + $0.0079/msg.
    to_number: "+13466664713"
    from_number: "+1XXXXXXXXXX"   # the number you buy in the Twilio console
    # Do NOT put creds here. Export them instead:
    #   export TWILIO_SID=ACxxxxx
    #   export TWILIO_TOKEN=xxxxx

  telegram:
    bot_token: ""        # or env TELEGRAM_TOKEN
    chat_id: ""          # or env TELEGRAM_CHAT_ID

  discord:
    webhook_url: ""      # or env DISCORD_WEBHOOK

# -----------------------------------------------------------------------------
# PAY
# -----------------------------------------------------------------------------
pay:
  floor_hourly: 45           # your Tesla base is 50; 45 leaves room for roles
                             # that pay less base but have far better cost of living
  great_hourly: 58           # anything at or above this gets a big score boost

  notify_if_unknown: true    # most postings outside CA/WA/NY/CO hide pay.
                             # false here would silently drop half the market.

  notify_if_below_floor: true   # CHANGED. You named Micron, TSMC and TI, all of
                                # which sit below 45. Rather than silently dropping
                                # them, they come through tagged [LOW PAY] with a
                                # score penalty so they sort to the bottom.
                                # Flip to false if you truly never want to see them.

